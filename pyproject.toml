[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "academic-intelligence"
version = "0.1.0"
description = "A modular Python library for academic data collection, fusion, and analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Paper Research Crawler Team" },
]
keywords = [
    "academic",
    "research",
    "papers",
    "citations",
    "google-scholar",
    "arxiv",
    "semantic-scholar",
    "openalex",
    "pubmed",
    "ieee",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20.0",
    "click>=8.1.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "trafilatura>=1.8",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "pytest-recording>=0.13",
    "vcrpy>=6.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # tests/test_fix_f.py encodes genuine brotli bodies (FIX-F offline
    # regression) and imports brotli unconditionally
    "brotli>=1.0.9",
    # webcrawler offline tests (test_extractors.py / test_crawler.py) exercise
    # the CSS rule-extraction backends
    "beautifulsoup4>=4.12",
    "cssselect>=1.2",
]
# WebCrawler extra: TLS-fingerprint transport (curl_cffi), browser rendering
# (scrapling) and LLM schema extraction (crawl4ai).  All three are optional,
# import-detected, and degrade gracefully to httpx / rule-mode extraction.
# trafilatura is listed here too so `pip install ".[crawler]"` brings the
# complete crawler stack (it is otherwise a formal dependency already).
crawler = [
    "curl_cffi>=0.7",
    "trafilatura>=1.8",
    "scrapling>=0.1",
    "crawl4ai>=0.6",
    # CSS rule extraction backends (extractors.py points users here when
    # neither is importable)
    "beautifulsoup4>=4.12",
    "cssselect>=1.2",
]
# PyMuPDF extra: AGPL-3.0-only PDF backend for the full-text parser
# (pdfplumber, MIT, is the default and a formal dependency).  Optional per
# upgrade I2: AGPL is only acceptable for personal local use — install with
# `pip install "academic-intelligence[pymupdf]"`.
pymupdf = [
    "pymupdf>=1.24",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "pymdown-extensions>=10.0",
]
export = [
    "pyarrow>=16.0",
]

[project.scripts]
paper = "academic_intelligence.cli:main"
# One-version-period compatibility shim: `ai` prints the rename notice and
# exits 2 (technical-design.md §8 migration).  The official command is `paper`.
ai = "academic_intelligence.cli:ai_legacy_shim"

[project.urls]
Homepage = "https://github.com/paper-research-crawler/academic-intelligence"
Documentation = "https://paper-research-crawler.github.io/academic-intelligence"
Repository = "https://github.com/paper-research-crawler/academic-intelligence"
Issues = "https://github.com/paper-research-crawler/academic-intelligence/issues"

[tool.hatch.build.targets.wheel]
packages = ["academic_intelligence"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Optional-dependency modules: installed, absent, or untyped depending on
# which extras are present.  Runtime import detection handles absence; mypy
# must tolerate every state so `mypy academic_intelligence` passes on a bare
# `.[dev]` install and on one with extras, without per-line type: ignore
# comments going stale as these libraries ship type information.
[[tool.mypy.overrides]]
module = ["bs4.*", "cssselect.*", "fitz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=academic_intelligence",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "network: marks tests that require network access",
    "boundary: marks tests as boundary tests",
    "performance: marks tests as performance tests",
]

[tool.coverage.run]
source = ["academic_intelligence"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "TODO",
]
